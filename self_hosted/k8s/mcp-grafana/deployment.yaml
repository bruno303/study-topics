apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: production
  labels:
    app: mcp-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-grafana
  template:
    metadata:
      labels:
        app: mcp-grafana
    spec:
      containers:
      - name: mcp-grafana
        image: grafana/mcp-grafana:2.3.0
        args:
        - "-t"
        - "streamable-http"
        - "--address"
        - "0.0.0.0:8000"
        # Host header allowlist: defaults to loopback only, so calls from
        # mcp-gateway (Host: mcp-grafana.production.svc.cluster.local) get 403.
        - "--allowed-hosts"
        - "mcp-grafana.production.svc.cluster.local,mcp-grafana.production.svc,mcp-grafana.production,mcp-grafana"
        env:
        - name: GRAFANA_URL
          value: "http://grafana.monitoring.svc.cluster.local"
        - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-grafana
              key: GRAFANA_SERVICE_ACCOUNT_TOKEN
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
