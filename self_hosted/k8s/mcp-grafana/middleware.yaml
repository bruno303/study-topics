# Basic auth gate for MCP endpoints that have no auth of their own (grafana).
# Users come from the `mcp-basic-auth` Secret (key `users`, htpasswd format),
# synced from Doppler by eso/mcp-externalsecret.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-basic-auth
  namespace: production
spec:
  basicAuth:
    secret: mcp-basic-auth
    removeHeader: true
