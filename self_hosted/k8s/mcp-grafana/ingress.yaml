apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-grafana-ingress
  namespace: production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: production-mcp-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: mcp-grafana.internal.bsoapp.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-grafana
            port:
              number: 80
