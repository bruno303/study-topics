apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning-poker-frontend
  namespace: production
  labels:
    app: planning-poker-frontend
    env: production
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: planning-poker-frontend
      env: production
  template:
    metadata:
      labels:
        app: planning-poker-frontend
        env: production
    spec:
      containers:
        - name: planning-poker-frontend
          image: bruno303/planning-poker-frontend:0.0.40
          env:
            - name: LOKI_URL
              value: http://loki.monitoring.svc.cluster.local
            - name: LOG_ENV
              value: production
            - name: NEXT_PUBLIC_APP_URL
              value: https://planning-poker.bsoapp.net
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
