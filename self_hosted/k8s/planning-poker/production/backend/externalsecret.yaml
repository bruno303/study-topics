apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: planning-poker-backend
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: planning-poker-backend
  data:
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: PLANNING_POKER_ADMIN_API_KEY