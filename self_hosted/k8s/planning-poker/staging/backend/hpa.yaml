apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planning-poker-backend
  namespace: staging
  labels:
    app: planning-poker-backend
    env: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planning-poker-backend
  # Keep one warm pod; scale up only when CPU demand grows.
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Wait for traffic to stay low before removing pods. Backend WebSocket
      # clients reconnect automatically when a pod is terminated.
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
