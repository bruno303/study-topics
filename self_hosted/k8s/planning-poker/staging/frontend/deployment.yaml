apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning-poker-frontend
  namespace: staging
  labels:
    app: planning-poker-frontend
    env: staging
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: planning-poker-frontend
      env: staging
  template:
    metadata:
      labels:
        app: planning-poker-frontend
        env: staging
    spec:
      containers:
        - name: planning-poker-frontend
          image: bruno303/planning-poker-frontend:cb4e2692e5e51f1b5ea63dfb4d66d7ecbd453b43
          env:
            - name: LOKI_URL
              value: http://loki.monitoring.svc.cluster.local
            - name: LOG_ENV
              value: staging
            - name: NEXT_PUBLIC_APP_URL
              value: https://planning-poker-staging.bsoapp.net
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
