apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: monitoring
  labels:
    app: otel-collector-agent
spec:
  selector:
    matchLabels:
      app: otel-collector-agent
  template:
    metadata:
      labels:
        app: otel-collector-agent
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Prepare the hostPath positions dir (root-owned) for the non-root collector (UID 10001)
        - name: init-positions
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /var/lib/otel-collector/positions && chown -R 10001:10001 /var/lib/otel-collector/positions
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: positions
              mountPath: /var/lib/otel-collector/positions
      containers:
        - name: otel-collector-agent
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/etc/otel-collector/otel-collector.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /var/lib/otel-collector/positions
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: otel-collector-agent
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: positions
          hostPath:
            path: /var/lib/otel-collector/positions
            type: DirectoryOrCreate