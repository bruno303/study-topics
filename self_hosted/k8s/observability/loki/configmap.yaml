apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
      replication_factor: 1
      path_prefix: /tmp/loki
    schema_config:
      configs:
      - from: 2020-05-15
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    storage_config:
      filesystem:
        directory: /tmp/loki/chunks
    limits_config:
      allow_structured_metadata: true
      # Map OTLP attributes (renamed to promtail-compatible names by the
      # otel-collector-agent) to index labels for label parity with promtail
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes:
                - namespace
                - pod_name
                - container_name
                - pod_uid
                - host
                - app
                - stream
                - log_level

