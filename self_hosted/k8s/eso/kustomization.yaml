apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.9.0
    releaseName: external-secrets
    namespace: eso
    valuesFile: values.yaml
resources:
  - secret-store-prd.yaml
  - secret-store-stg.yaml
  - ntfy-externalsecret.yaml
# The secretstore/clustersecretstore CRDs are too large (>262KB) for client-side
# apply, so ArgoCD applies them with Replace (no last-applied annotation).
patches:
  - target:
      kind: CustomResourceDefinition
      name: secretstores.external-secrets.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: secretstores.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: Replace=true
  - target:
      kind: CustomResourceDefinition
      name: clustersecretstores.external-secrets.io
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: clustersecretstores.external-secrets.io
        annotations:
          argocd.argoproj.io/sync-options: Replace=true