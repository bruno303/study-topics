apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: ntfy
  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: NTFY_AUTH_USERS