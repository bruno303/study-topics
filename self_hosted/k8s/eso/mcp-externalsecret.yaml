apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: mcp-grafana
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: GRAFANA_SERVICE_ACCOUNT_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-basic-auth
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: mcp-basic-auth
    template:
      data:
        users: "{{ .MCP_BASIC_AUTH_USERS }}"
  data:
    - secretKey: MCP_BASIC_AUTH_USERS
      remoteRef:
        key: MCP_BASIC_AUTH_USERS
