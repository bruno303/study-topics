apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: mcp-grafana
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: GRAFANA_SERVICE_ACCOUNT_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-sonarqube
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: mcp-sonarqube
  data:
    - secretKey: SONARQUBE_ORG
      remoteRef:
        key: SONARQUBE_ORG
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-prd
    kind: ClusterSecretStore
  target:
    name: mcp-gateway
    template:
      data:
        users: "{{ .MCP_BASIC_AUTH_USERS }}"
        SESSION_KEY: "{{ .MCP_GATEWAY_SESSION_KEY }}"
        SONARQUBE_TOKEN: "{{ .SONARQUBE_TOKEN }}"
  data:
    - secretKey: MCP_BASIC_AUTH_USERS
      remoteRef:
        key: MCP_BASIC_AUTH_USERS
    - secretKey: MCP_GATEWAY_SESSION_KEY
      remoteRef:
        key: MCP_GATEWAY_SESSION_KEY
    - secretKey: SONARQUBE_TOKEN
      remoteRef:
        key: SONARQUBE_TOKEN
