apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sonarqube
  namespace: production
  labels:
    app: mcp-sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sonarqube
  template:
    metadata:
      labels:
        app: mcp-sonarqube
    spec:
      containers:
      - name: mcp-sonarqube
        image: sonarsource/sonarqube-mcp:1.33.0.5260
        env:
        # Streamable HTTP: each client sends its own SonarQube token as
        # `Authorization: Bearer <token>`; no token/org is stored server-side.
        - name: SONARQUBE_TRANSPORT
          value: "http"
        - name: SONARQUBE_HTTP_HOST
          value: "0.0.0.0"
        - name: SONARQUBE_HTTP_PORT
          value: "8080"
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
