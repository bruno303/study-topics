apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sonarqube
  namespace: production
  labels:
    app: mcp-sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sonarqube
  template:
    metadata:
      labels:
        app: mcp-sonarqube
    spec:
      containers:
      - name: mcp-sonarqube
        image: sonarsource/sonarqube-mcp:1.33.0.5260
        env:
        # Streamable HTTP: requests must carry `Authorization: Bearer <token>`
        # (injected by mcp-gateway). SONARQUBE_ORG is deprecated by Sonar in HTTP
        # mode but still honored: it pins every request to this org.
        - name: SONARQUBE_TRANSPORT
          value: "http"
        - name: SONARQUBE_HTTP_HOST
          value: "0.0.0.0"
        - name: SONARQUBE_HTTP_PORT
          value: "8080"
        - name: SONARQUBE_ORG
          valueFrom:
            secretKeyRef:
              name: mcp-sonarqube
              key: SONARQUBE_ORG
        # No startup SONARQUBE_TOKEN on purpose: it makes the server download
        # analyzer plugins at boot, which OOMs the JVM at this memory limit and
        # kills its HTTP client (every tool call then fails). The gateway injects
        # the token per request instead.
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
